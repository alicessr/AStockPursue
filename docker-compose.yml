services:
  go-core:
    build:
      context: services/go
      dockerfile: Dockerfile
    ports:
      - "8899:8899"
    environment:
      PORT: "8899"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/astockpursue?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      JWT_SECRET: "${JWT_SECRET:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - vt-net

  python-research:
    build:
      context: services/python
      dockerfile: Dockerfile.python
    ports:
      - "8900:8900"
      - "8902:8902"
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/astockpursue?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      TDX_DB_PATH: "/data/tdx/tdx.db"
      BIYING_API_KEY: "${BIYING_API_KEY:-}"
      BIYINGAPI_KEY: "${BIYING_API_KEY:-}"
      JIN10_MCP_TOKEN: "${JIN10_MCP_TOKEN:-}"
      XA_PROJECT_ROOT: "${XA_PROJECT_ROOT:-D:/XA Qlib Claw}"
      # LLM (2026-08-07): AStockPursue 专用 DeepSeek — key 见 XA config/secrets/astockpursue.json
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "https://api.deepseek.com/v1"
      LANGCHAIN_PROVIDER: "deepseek"
      LANGCHAIN_MODEL_NAME: "deepseek-v4-flash"
      LANGCHAIN_TEMPERATURE: "0.0"
      # 2026-08-07: XA 源码路径 (SignalEngine 用真 XA 引擎)
      ASTOCKPURSUE_XA_SRC: "/app/xa_src"
    depends_on:
      go-core:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - vt-net
    volumes:
      - ./runs:/app/runs
      - ./services/python/src:/app/src
      - /d/tdx2db/parquet:/data/tdx:ro
      # 2026-08-07: XA 源码挂载 — SignalEngine 用真 XA 引擎 (肯泰罗+缠论+闸门)
      - "D:/XA Qlib Claw/src:/app/xa_src:ro"
      # 2026-08-07: XA vendored 缠论库 (chan.py, 含 ClawAPI 适配) — 目录即包根
      - "D:/XA Qlib Claw/lib/chan.py:/app/chan:ro"

  # Frontend runs separately for dev. To include it, use:
  #   docker compose --profile frontend up -d
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "5899:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8899"
      PORT: "3000"
    depends_on:
      - go-core
    networks:
      - vt-net
    profiles:
      - frontend

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: astockpursue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./services/python/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vt-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - vt-net

networks:
  vt-net:
    driver: bridge

volumes:
  pg-data:
  redis-data:
